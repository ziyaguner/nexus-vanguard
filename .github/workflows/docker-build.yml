name: Nexus Vanguard CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install flake8
      - name: Run flake8 (report only)
        run: |
          flake8 . \
            --max-line-length=150 \
            --exclude=.git,__pycache__,migrations,venv,.venv \
            --extend-ignore=E302,E303,E501,W503,E741,E712,F401 \
            --statistics \
            || true

  docker-build:
    name: Docker Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t nexus-vanguard:${{ github.sha }} .
      - name: Verify container starts
        run: |
          docker run -d --name nv_test -p 5001:5001 nexus-vanguard:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5001/login || exit 1
          docker stop nv_test
